name: Branch Name Validation

# Define the GitHub workflow for branch name validation.

# Copyright (c) 2026 Paul Sinclair
# SPDX-License-Identifier: MIT
# For license details, see ../LICENSE.

#----------------------------------------------------------------------------------
# Validate pull request branch names against repository branch rules.
#
# Branches targeting main must use a version format:
#   vM.n.p
# where:
#   M is 1-2 digits starting with 1-9.
#   n/p are either 0 or 1-2 digits starting with 1-9.
#
# Branches targeting non-main branches must not contain periods and must not be
# named main.
#
# This workflow mirrors the branch-naming policy used by scripts/mkbranch.
# 
# YAML is a plain‑text, human‑readable format where indentation defines structure.
# Files (with the extension .yml) contain YAML text and are used by GitHub Actions.
#----------------------------------------------------------------------------------

# Set workflow to run on pull request events.

on:
  pull_request:
    branches:
      - main
      - '**'

permissions:
  contents: read

jobs:
  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name rules
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          version_regex='^v[1-9][0-9]?\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$'
          no_period_regex='^[^.]+$'

          if [[ "$BASE_REF" == "main" ]]; then
            if [[ ! "$HEAD_REF" =~ $version_regex ]]; then
              echo "ERROR: Branches targeting main must match: vM.n.p"
              echo "Examples: v1.2.3, v12.3.4, v2.0.0"
              echo "Rejected: $HEAD_REF"
              exit 1
            fi
          else
            if [[ "$HEAD_REF" == "main" ]]; then
              echo "ERROR: Branches not targeting main cannot be named main."
              echo "Rejected: $HEAD_REF"
              exit 1
            fi

            if [[ ! "$HEAD_REF" =~ $no_period_regex ]]; then
              echo "ERROR: Branches not targeting main must not contain periods."
              echo "Rejected: $HEAD_REF"
              exit 1
            fi
          fi

          echo "Branch name OK: $HEAD_REF (target: $BASE_REF)."
