name: Defines Branch Names Validation and Branch Workflow

# Define the GitHub workflow for branch name validation.

# Copyright (c) 2026 Paul Sinclair
# SPDX-License-Identifier: MIT
# For license details, see '<repo>/LICENSE'.

#-----------------------------------------------------------------------------
# Validate pull request branch names against repository branch rules
# for the following four kinds of branches:
#
# The 'main' branch (protected).
#
# A 'version' branch (protected, based on the main branch, created by
# an approver) with branch name in the form:
#
#   vM.m.0
#
# where:
#
#   M is 1-2 digits starting with 1-9.
#   m is either 0 or 1-2 digits starting with 1-9.
#
# A 'targeted' branch (not protected, based on a version branch) with
# a branch name in one of the forms:
#
#   dev/<short-name>-<target-version>
#   fix/<short-name>-<target-version>
#
# where:
#   <short-name> is a brief lowercase descriptor using letters,
#   numbers, and hyphens.
#
#   <target-version> is the name of the 'version' branch.
#
# A 'contributor' branch (not protected, not based on 'main' or a
# 'version' branch) with a branch name in the form:
#
#   [<type>/]<short-name>
#
#  where <type> is a lowercase word using only letters, for example,
#  'dev', 'fix', or 'mywork'.
#
# Protected branches:
# - Require pull request before merging
# - Require approvals (1+)
# - Require status checks
# - Block force pushes
# - Block deletions
#
# This workflow mirrors the branch-naming policy used by scripts/bin/mkbranch.
# 
# For more information, see '<repo>/docs/md/Contributor_Guide.md'.
#
# YAML is a plain‑text, human‑readable format where indentation defines
# structure. Files (with the extension .yml) contain YAML text and are
# used by GitHub Actions.
#-----------------------------------------------------------------------------

# Set workflow to run on pull request events.

on:
  pull_request:
    branches:
      - main
      - '**'

permissions:
  contents: read

jobs:
  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name rules
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          version_regex='^v[1-9][0-9]?\.(0|[1-9][0-9]?)\.0$'
          targeted_regex='^(dev|fix)/[a-z0-9-]+-v[1-9][0-9]?\.(0|[1-9][0-9]?)\.0$'
          contributor_regex='^([a-z]+/)?[a-z0-9-]+$'

          if [[ "$BASE_REF" == "main" ]]; then
            if [[ ! "$HEAD_REF" =~ $version_regex ]]; then
              echo "Invalid branch name: $HEAD_REF."
              echo "Branch targets main but does not have a name with the required"
              echo "form vM.m.0. Example valid names are v1.2.0, v12.3.0, and v2.0.0,"
              exit 1
            fi
          else
          if [[ "$BASE_REF" == $version_regex" ]]; then
            if [[ ! "$HEAD_REF" =~ $targeted_regex ]]; then
              echo "Invalid branch name: $HEAD_REF."
              echo "Branch targets a version branch but does not have a valid targeted"
              echo "branch name. Example valid naes are fix/seg-fault-v12.3.0"
              echo "and dev/memory-managment-v1.2.0."
              exit 1
            fi 
          else
          if [[ "$HEAD_REF" == "main" ]]; then
            echo "Invalid branch name: main. A contributor branch cannot be main."
          if [[ ! "$HEAD_REF" =~ $contributor_regex ]]; then
            if [[ "$HEAD_REF" == $version_regex ]]; then
              echo "Invalid branch name: $HEAD_REF."
              echo "Name is a version branch name but branch doesn't target main."
              exit 1
            else
            if [[ "$HEAD_REF" == $targeted_regex ]]; then
              echo "Invalid branch name: $HEAD_REF."
              echo "Name is a targeted branch name but branch doesn't target a version"
              echo "branch."
              exit 1
            else
              echo "Invalid branch name: $HEAD_REF."
              echo "Name must be a version, targeted, or contributor branch nane,"
              echo "branch."
              exit 1
            fi
          else
            if [[ ! "$BASE_REF" =~ $targeted_regex ]] &&
               [[ ! "$HEAD_REF" =~ $contributor_regex ]]; then
              echo "Invalid branch: $HEAD_REF."
              echo "A contributor branch must target a targeted branch or "
              echo "a contributor branch,"
              echo "branch."
              exit 1
            fi
          fi

          echo "Valid branch name: $HEAD_REF (target: $BASE_REF)."
