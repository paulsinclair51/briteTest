name: Branch Name Validation

on:
  pull_request:
    branches:
      - main
      - '**'

permissions:
  contents: read

jobs:
  validate-branch-name:
    name: Validate branch name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name rules
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          version_regex='^v[1-9][0-9]?\.[1-9][0-9]?\.[1-9][0-9]?$'
          no_period_regex='^[^.]+$'

          if [[ "$BASE_REF" == "main" ]]; then
            if [[ ! "$HEAD_REF" =~ $version_regex ]]; then
              echo "ERROR: Branches targeting main must match: vM.n.p"
              echo "Examples: v1.2.3, v12.3.4"
              echo "Rejected: $HEAD_REF"
              exit 1
            fi
          else
            if [[ "$HEAD_REF" == "main" || ! "$HEAD_REF" =~ $no_period_regex ]]; then
              echo "ERROR: Branches not targeting main must not contain periods and cannot be named main."
              echo "Rejected: $HEAD_REF"
              exit 1
            fi
          fi

          echo "Branch name OK: $HEAD_REF (target: $BASE_REF)."
