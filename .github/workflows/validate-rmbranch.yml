name: Protect Branch Deletion

# Define the GitHub workflow for protecting branch deletion.

# Copyright (c) 2026 Paul Sinclair
# SPDX-License-Identifier: MIT
# For license details, see '<repo>/LICENSE'.

#-----------------------------------------------------------------------------
# Prevent deletion of protected branches.
#
# This workflow protects the following branch types from being deleted:
#
# 1. The 'main' branch (protected).
#
# 2. A 'version' branch (protected) with branch name in the form:
#
#      v<M>.<m>.0
#
#    where:
#
#      <M> is 1-2 digits starting with 1-9.
#      <m> is either 0 or 1-2 digits starting with 1-9.
#
# Protected branches cannot be deleted via this workflow.
#
# For more information, see '<repo>/docs/md/Contributor_Guide.md'.
#
# YAML is a plain‑text, human‑readable format where indentation defines
# structure. Files (with the extension .yml) contain YAML text and are
# used by GitHub Actions.
#-----------------------------------------------------------------------------

# Set workflow to run on delete events.

on:
  delete:

permissions:
  contents: read

jobs:
  protect-branch-deletion:
    name: Protect branch deletion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if deleted branch is protected
        shell: bash
        env:
          REF_NAME: ${{ github.event.ref }}
          REF_TYPE: ${{ github.event.ref_type }}
        run: |
          set -euo pipefail

          # Only check branch deletions, not tag deletions
          if [[ "$REF_TYPE" != "branch" ]]; then
            echo "Deletion of $REF_TYPE '$REF_NAME' is allowed."
            exit 0
          fi

          # Get branch type using ckbranchname.sh helper
          # Exit codes: 1=main, 2=version, 3=targeted, 4=contributor, 5=invalid
          branch_result=$(bash briteRepo/helpers/ckbranchname.sh "$REF_NAME" 2>/dev/null; echo $?)

          # Helper function to get branch type name
          get_type_name() {
            local type_code=$1
            case $type_code in
              1) echo "main" ;;
              2) echo "version" ;;
              3) echo "targeted" ;;
              4) echo "contributor" ;;
              5) echo "invalid" ;;
              *) echo "unknown" ;;
            esac
          }

          branch_type_name=$(get_type_name "$branch_result")

          # Protect main (type 1) and version (type 2) branches
          if [[ $branch_result -eq 1 ]]; then
            echo "ERROR: Cannot delete protected branch '$REF_NAME' (type: main)"
            echo "The main branch is protected and cannot be deleted."
            exit 1
          elif [[ $branch_result -eq 2 ]]; then
            echo "ERROR: Cannot delete protected branch '$REF_NAME' (type: version)"
            echo "Version branches are protected and cannot be deleted."
            exit 1
          fi

          echo "Branch '$REF_NAME' (type: $branch_type_name) was deleted."
