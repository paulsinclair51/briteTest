name: Announce Release

on:
  release:
    types: [published]

permissions:
  contents: read
  discussions: write

jobs:
  announce-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release announcement in Discussions
        uses: actions/github-script@v7
        with:
          script: |
            const release = context.payload.release;
            const title = `📢 Release: ${release.tag_name}`;
            
            let body = `## ${release.name || release.tag_name}\n\n`;
            
            if (release.body) {
              body += release.body + '\n\n';
            }
            
            body += `**[View Release Details](${release.html_url})**\n\n`;
            body += `For questions or feedback, please use this discussion thread.`;
            
            try {
              const discussion = await github.rest.discussions.createDiscussion({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                category_id: 'DIC_kwDOJ-tW8s4Chzqe' // Announcements category - update if needed
              });
              
              console.log(`✅ Release announcement created: ${discussion.data.html_url}`);
            } catch (error) {
              // If default category doesn't exist, try without specifying it
              const discussion = await github.rest.discussions.createDiscussion({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body
              });
              
              console.log(`✅ Release announcement created: ${discussion.data.html_url}`);
            }
