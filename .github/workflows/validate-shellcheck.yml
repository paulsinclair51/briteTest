name: ShellCheck

# Define the GitHub workflow for shell script linting using ShellCheck.

# Copyright (c) 2026 Paul Sinclair
# SPDX-License-Identifier: MIT
# For license details, see '<repo>/LICENSE'.

on:
  pull_request:
    paths:
      - 'briteRepo/**'
      - '.github/workflows/validate-shellcheck.yml'
  push:
    branches:
      - main
      - dev/**
      - fix/**
    paths:
      - 'briteRepo/**'
      - '.github/workflows/validate-shellcheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck (scripts)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Collect shell scripts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git ls-files 'briteRepo/**' | while IFS= read -r f; do
              [[ -f "$f" ]] || continue
              head -n1 "$f" | grep -Eq '^#!.*(ba)?sh' && echo "$f"
            done
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No shell scripts found under briteRepo/."
            exit 0
          fi

          printf '%s\n' "${files[@]}" > shellcheck-files.txt
          echo "Found ${#files[@]} shell scripts"

      - name: Run ShellCheck (error gate)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < shellcheck-files.txt
          shellcheck -x -P briteRepo --severity=error "${files[@]}"

      - name: Run ShellCheck (warning report)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < shellcheck-files.txt
          shellcheck -x -P briteRepo --severity=warning "${files[@]}" || true
