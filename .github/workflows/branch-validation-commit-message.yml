name: Validate Commit Messages

# Copyright (c) 2026 Paul Sinclair
# SPDX-License-Identifier: MIT

#-----------------------------------------------------------------------------
# COMMIT MESSAGE VALIDATION - Enforce conventional commits format
#
# Validates that commit messages follow conventional commit format
# for clarity, consistency, and automated changelog generation.
#
# FORMAT: <type>[optional scope]: <description>
# TYPES: feat, fix, docs, style, refactor, test, chore
#-----------------------------------------------------------------------------

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-commit-messages:
    name: Validate commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit message format
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          echo "=== COMMIT MESSAGE VALIDATION ==="
          commits=$(git log origin/$BASE_REF..origin/$HEAD_REF --format=%H 2>/dev/null || echo "")
          [[ -z "$commits" ]] && exit 0
          
          valid_types="feat|fix|docs|style|refactor|test|chore"
          failed=0
          for commit in $commits; do
            subject=$(git log -1 --format=%s "$commit")
            if ! echo "$subject" | grep -qE "^($valid_types)(\([^)]+\))?: .+"; then
              echo "✗ Invalid: $subject"
              failed=$((failed + 1))
            fi
          done
          [[ $failed -eq 0 ]] && echo "✓ All commits valid" || exit 1
