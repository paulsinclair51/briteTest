name: Validate Branch Names on Push

# Define the GitHub workflow for branch name validation on push events.

# Copyright (c) 2026 Paul Sinclair
# SPDX-License-Identifier: MIT
# For license details, see '<repo>/LICENSE'.

#-----------------------------------------------------------------------------
# Validate branch names when pushing to the repository.
#
# This workflow validates branch names against repository branch rules
# for the following four kinds of branches:
#
# 1. The 'main' branch (protected).
#
# 2. A 'version' branch (protected, based on the main branch, created by
#    an approver) with branch name in the form:
#
#      v<M>.<m>.0
#
#    where:
#
#      <M> is 1-2 digits starting with 1-9.
#      <m> is either 0 or 1-2 digits starting with 1-9.
#
# 3. A 'targeted' branch (not protected, based on a version branch) with
#    a branch name in one of the forms:
#
#      dev/<description>-<target-version>
#      fix/<description>-<target-version>
#
#    where:
#
#      <description> consists of lowercase letters, digits, and hyphens.
#      <target-version> is the name of the 'version' branch.
#
# 4. A 'contributor' branch (not protected, not based on 'main' or a
#    'version' branch) with a branch name (other than 'main') in the form:
#
#       [<type>/]<description>
#
#     where <type> consists of between 1 and 30 lowercase letters (for example,
#     'dev', 'fix', or 'mywork') and <description> is as defined above.
#
# This workflow mirrors the branch-naming policy used by
# <repo>/scripts/bin/mkbranch.
# 
# For more information, see '<repo>/docs/md/Contributor_Guide.md'.
#
# YAML is a plain‑text, human‑readable format where indentation defines
# structure. Files (with the extension .yml) contain YAML text and are
# used by GitHub Actions.
#-----------------------------------------------------------------------------

# Set workflow to run on push events to all branches.

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  validate-branch:
    name: Validate branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check branch name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # Get branch type using ckbranchname.sh helper
          # Exit codes: 1=main, 2=version, 3=targeted, 4=contributor, 5=invalid
          branch_result=$(bash scripts/helpers/ckbranchname.sh "$REF_NAME" 2>/dev/null; echo $?)

          # Helper function to get branch type name
          get_type_name() {
            local type_code=$1
            case $type_code in
              1) echo "main" ;;
              2) echo "version" ;;
              3) echo "targeted" ;;
              4) echo "contributor" ;;
              5) echo "invalid" ;;
              *) echo "unknown" ;;
            esac
          }

          branch_type_name=$(get_type_name "$branch_result")

          # Validate branch name
          if [[ $branch_result -eq 5 ]]; then
            echo "Invalid push: branch name '$REF_NAME'"
            echo "does not match any valid branch naming pattern."
            echo ""
            echo "Valid branch types are:"
            echo "  1. main (protected)"
            echo "  2. version (e.g., v1.0.0)"
            echo "  3. targeted (e.g., dev/my-feature-v1.0.0)"
            echo "  4. contributor (e.g., my-feature or fix/my-fix)"
            exit 1
          fi

          echo "Valid branch: $REF_NAME (type: $branch_type_name)"
