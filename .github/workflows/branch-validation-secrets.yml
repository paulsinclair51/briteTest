name: Detect Secrets

# Copyright (c) 2026 Paul Sinclair
# SPDX-License-Identifier: MIT

#-----------------------------------------------------------------------------
# SECRET DETECTION - Prevent credentials from being committed
#
# Detects API keys, passwords, credentials, and other secrets.
#
# If secrets are found:
# 1. Do NOT commit the credentials
# 2. Regenerate/rotate the compromised secret
# 3. Remove from history: git filter-repo --path <file>
#-----------------------------------------------------------------------------

on:
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "=== SECRET DETECTION ==="
          changed_files=$(git diff origin/$BASE_REF...origin/$HEAD_REF --name-only 2>/dev/null || echo "")
          [[ -z "$changed_files" ]] && exit 0
          
          patterns=(
            "-----BEGIN (RSA|OPENSSH) PRIVATE KEY"
            "aws_access_key_id"
            "aws_secret_access_key"
            "AKIA[0-9A-Z]{16}"
            "ghp_[0-9a-zA-Z]{36,255}"
          )
          
          failed=0
          for file in $changed_files; do
            [[ ! -f "$file" ]] && continue
            for pattern in "${patterns[@]}"; do
              grep -E "$pattern" "$file" >/dev/null 2>&1 && echo "✗ Secret in: $file" && failed=$((failed + 1))
            done
          done
          [[ $failed -eq 0 ]] && echo "✓ No secrets detected" || exit 1
