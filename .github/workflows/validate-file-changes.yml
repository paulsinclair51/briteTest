name: Validate File Changes

# Copyright (c) 2026 Paul Sinclair
# SPDX-License-Identifier: MIT

#-----------------------------------------------------------------------------
# FILE CHANGE PROTECTION - Prevent modifications to critical files
#
# Prevents accidental or malicious modifications to LICENSE, SECURITY.md,
# workflow files, and other protected files.
#
# PROTECTED: LICENSE*, SECURITY.md, .github/workflows/**, .gitignore
#-----------------------------------------------------------------------------

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate-file-changes:
    name: Validate file changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check protected file changes
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "=== FILE CHANGE VALIDATION ==="
          changed_files=$(git diff origin/$BASE_REF...origin/$HEAD_REF --name-only 2>/dev/null || echo "")
          [[ -z "$changed_files" ]] && exit 0
          
          protected_patterns=("LICENSE" "COPYING" "SECURITY.md" ".github/workflows" ".gitignore")
          failed=0
          for file in $changed_files; do
            for pattern in "${protected_patterns[@]}"; do
              [[ "$file" == *"$pattern"* ]] && echo "✗ Protected: $file" && failed=$((failed + 1))
            done
          done
          [[ $failed -eq 0 ]] && echo "✓ No protected files modified" || exit 1
