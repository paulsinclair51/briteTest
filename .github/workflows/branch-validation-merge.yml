name: Validate Branch Merge

# Define the GitHub workflow for validating branch merges.

# Copyright (c) 2026 Paul Sinclair
# SPDX-License-Identifier: MIT
# For license details, see '<repo>/LICENSE'.

#-----------------------------------------------------------------------------
# Validate that merged branches follow repository branch rules.
#
# This workflow runs after a merge is completed and verifies that only
# valid branch types were merged and that merges followed the correct rules:
#
# 1. The 'main' branch (protected) - No merges allowed TO main except from
#    version branches (requires approver).
#
# 2. A 'version' branch (protected) - Only merges from targeted branches
#    (requires approver).
#
# 3. A 'targeted' branch - Merges from contributor branches allowed.
#
# 4. A 'contributor' branch - Merges from other contributor branches allowed.
#
# This workflow provides an additional safety check after merge to ensure
# branch policies were followed, useful for audit and compliance logging.
#
# For more information, see '<repo>/docs/md/Contributor_Guide.md'.
#
# YAML is a plain‑text, human‑readable format where indentation defines
# structure. Files (with the extension .yml) contain YAML text and are
# used by GitHub Actions.
#-----------------------------------------------------------------------------

# Set workflow to run on push events to main, version, and targeted branches.

on:
  push:
    branches:
      - main
      - v[0-9]+.[0-9]+.0
      - 'dev/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  validate-merge:
    name: Validate merge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check merge rules
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # Get the current branch type
          branch_result=$(bash scripts/helpers/ckbranchname.sh "$REF_NAME" 2>/dev/null; echo $?)

          # Helper function to get branch type name
          get_type_name() {
            local type_code=$1
            case $type_code in
              1) echo "main" ;;
              2) echo "version" ;;
              3) echo "targeted" ;;
              4) echo "contributor" ;;
              5) echo "invalid" ;;
              *) echo "unknown" ;;
            esac
          }

          branch_type_name=$(get_type_name "$branch_result")

          # Check if this is a merge commit (has parent commits)
          # If not a merge, skip validation (could be a direct push)
          if git rev-parse HEAD^2 >/dev/null 2>&1; then
            # This is a merge commit
            parent1=$(git rev-parse HEAD^1)
            parent2=$(git rev-parse HEAD^2)
            
            # Get the source branch name from the commit message or merge commit info
            # For GitHub-created merge commits, format is typically:
            # "Merge pull request #N from owner/source-branch into target-branch"
            merge_source=$(git log -1 --pretty=%B HEAD | grep -oP 'from \K[^ ]+' | cut -d'/' -f2 || echo "unknown")
            
            if [[ "$merge_source" != "unknown" ]]; then
              # Validate source branch type
              source_result=$(bash scripts/helpers/ckbranchname.sh "$merge_source" 2>/dev/null; echo $?)
              source_type_name=$(get_type_name "$source_result")

              echo "Merge detected:"
              echo "  Source branch: $merge_source (type: $source_type_name)"
              echo "  Target branch: $REF_NAME (type: $branch_type_name)"

              # Validate merge rules
              case $branch_result in
                # 1. 'main' branch - only version branches can merge to it
                1)
                  if [[ $source_result -ne 2 ]]; then
                    echo "ERROR: Invalid merge to main from $merge_source (type: $source_type_name)"
                    echo "Only version branches can merge to main."
                    exit 1
                  fi
                  ;;

                # 2. 'version' branch - only targeted branches can merge to it
                2)
                  if [[ $source_result -ne 3 ]]; then
                    echo "ERROR: Invalid merge to version branch $REF_NAME from $merge_source (type: $source_type_name)"
                    echo "Only targeted branches can merge to version branches."
                    exit 1
                  fi
                  ;;

                # 3. 'targeted' branch - contributor branches can merge
                3)
                  if [[ $source_result -ne 4 ]]; then
                    echo "ERROR: Invalid merge to targeted branch $REF_NAME from $merge_source (type: $source_type_name)"
                    echo "Only contributor branches can merge to targeted branches."
                    exit 1
                  fi
                  ;;

                # 4. 'contributor' branch - contributor branches can merge
                4)
                  if [[ $source_result -ne 4 ]]; then
                    echo "ERROR: Invalid merge to contributor branch $REF_NAME from $merge_source (type: $source_type_name)"
                    echo "Only contributor branches can merge to contributor branches."
                    exit 1
                  fi
                  ;;

                *)
                  echo "ERROR: Unknown branch type for $REF_NAME"
                  exit 1
                  ;;
              esac

              echo "Valid merge: $merge_source merged into $REF_NAME"
            else
              echo "WARNING: Could not determine source branch from merge commit. Skipping detailed validation."
              echo "Merge target: $REF_NAME (type: $branch_type_name)"
            fi
          else
            # Direct push (not a merge) - just log it
            echo "Direct push to $REF_NAME (type: $branch_type_name) - not a merge commit."
          fi
