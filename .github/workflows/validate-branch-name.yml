name: Defines Branch Name Validation and Branch Workflow

# Define the GitHub workflow for branch name validation.

# Copyright (c) 2026 Paul Sinclair
# SPDX-License-Identifier: MIT
# For license details, see '<repo>/LICENSE'.

#-----------------------------------------------------------------------------
# Validate pull request branch names against repository branch rules
# for the following four kinds of branches:
#
# 1. The 'main' branch (protected).
#
# 2. A 'version' branch (protected, based on the main branch, created by
#    an approver) with branch name in the form:
#
#      v<M>.<m>.0
#
#    where:
#
#      <M> is 1-2 digits starting with 1-9.
#      <m> is either 0 or 1-2 digits starting with 1-9.
#
# 3. A 'targeted' branch (not protected, based on a version branch) with
#    a branch name in one of the forms:
#
#      dev/<description>-<target-version>
#      fix/<description>-<target-version>
#
#    where:
#
#      <description> consists of lowercase letters, digits, and hyphens.
#      <target-version> is the name of the 'version' branch.
#
# 4. A 'contributor' branch (not protected, not based on 'main' or a
#    'version' branch) with a branch name (other than 'main') in the form:
#
#       [<type>/]<description>
#
#     where <type> consists of between 1 and 30 lowercase letters (for example,
#     'dev', 'fix', or 'mywork') and <description> is as defined above.
#
# Protected branches:
#
# - Require pull request before merging
# - Require approvals (1+)
# - Require status checks
# - Block force pushes
# - Block deletions
#
# This workflow mirrors the branch-naming policy used by
# <repo>/briteRepo/bin/mkbranch.
# 
# For more information, see '<repo>/docs/md/Contributor_Guide.md'.
#
# YAML is a plain‑text, human‑readable format where indentation defines
# structure. Files (with the extension .yml) contain YAML text and are
# used by GitHub Actions.
#-----------------------------------------------------------------------------

# Set workflow to run on pull request events.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate-branch:
    name: Validate branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check branch rules
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          # Optional comma-separated actor allowlist for internal/bot PRs.
          # Example: dependabot[bot],github-actions[bot]
          CKROLE_TRUSTED_ACTORS: ${{ vars.CKROLE_TRUSTED_ACTORS }}
        run: |
          set -euo pipefail

          # Get branch types using ckbranchname.sh helper
          # Exit codes: 1=main, 2=version, 3=targeted, 4=contributor, 5=invalid
          head_result=$(bash briteRepo/helpers/ckbranchname.sh "$HEAD_REF" 2>/dev/null; echo $?)
          base_result=$(bash briteRepo/helpers/ckbranchname.sh "$BASE_REF" 2>/dev/null; echo $?)

          # Helper function to get branch type name
          get_type_name() {
            local type_code=$1
            case $type_code in
              1) echo "main" ;;
              2) echo "version" ;;
              3) echo "targeted" ;;
              4) echo "contributor" ;;
              5) echo "invalid" ;;
              *) echo "unknown" ;;
            esac
          }

          head_type_name=$(get_type_name "$head_result")
          base_type_name=$(get_type_name "$base_result")

          # Validate branch type of HEAD_REF
          if [[ $head_result -eq 5 ]]; then
            echo "Invalid pull request: pulling source $HEAD_REF"
            echo "has an invalid branch name."
            exit 1
          elif [[ $head_result -eq 1 ]]; then
            echo "Invalid pull request: pulling from main is not allowed."
            exit 1
          fi

          # Validate branch type of BASE_REF before checking rules
          if [[ $base_result -eq 5 ]]; then
            echo "Invalid pull request: base branch $BASE_REF"
            echo "has an invalid branch name."
            exit 1
          fi

          # Validate BASE_REF based on HEAD_REF type
          case $head_result in
            # 2. 'version' branch (HEAD_REF is version)
            2)
              if [[ $base_result -ne 1 ]]; then
                echo "Invalid pull request: version branch $HEAD_REF must only pull"
                echo "to main and not to $BASE_REF (type: $base_type_name)."
                exit 1
              fi
              if ! bash briteRepo/helpers/ckrole.sh approver; then
                echo "Invalid pull request: $GITHUB_ACTOR must be an approver"
                echo "to pull from version branch $HEAD_REF to $BASE_REF."
                exit 1
              fi
              ;;

            # 3. 'targeted' branch (HEAD_REF is targeted)
            3)
              if [[ $base_result -ne 2 ]]; then
                echo "Invalid pull request: targeted branch $HEAD_REF"
                echo "must only pull to a version branch and not to $BASE_REF"
                echo "(type: $base_type_name)."
                exit 1
              fi
              # Extract target version from HEAD_REF (everything after the last hyphen)
              target_version="${HEAD_REF##*-}"
              if [[ "$target_version" != "$BASE_REF" ]]; then
                echo "Invalid pull request: targeted branch $HEAD_REF"
                echo "must only pull to the version branch named in its suffix"
                echo "($target_version) and not to $BASE_REF."
                exit 1
              fi
              if ! bash briteRepo/helpers/ckrole.sh approver; then
                echo "Invalid pull request: $GITHUB_ACTOR must be an approver"
                echo "to pull from targeted branch $HEAD_REF to $BASE_REF."
                exit 1
              fi
              ;;

            # 4. 'contributor' branch (HEAD_REF is contributor)
            4)
              if [[ $base_result -ne 3 && $base_result -ne 4 ]]; then
                echo "Invalid pull request: contributor branch $HEAD_REF"
                echo "must only pull to a targeted or contributor branch and not"
                echo "to $BASE_REF (type: $base_type_name)."
                exit 1
              fi
              if ! bash briteRepo/helpers/ckrole.sh contributor; then
                echo "Invalid pull request: $GITHUB_ACTOR must be a contributor"
                echo "to pull from contributor branch $HEAD_REF to $BASE_REF."
                exit 1
              fi
              ;;

            *)
              echo "Unexpected error: unable to determine branch type for $HEAD_REF"
              exit 1
              ;;
          esac

          echo "Valid pull request from $HEAD_REF to $BASE_REF."
