name: Validate Code Quality

# Copyright (c) 2026 Paul Sinclair
# SPDX-License-Identifier: MIT

#-----------------------------------------------------------------------------
# CODE QUALITY VALIDATION - Lint, format, and security checks
#
# Runs code quality checks including linting, formatting verification,
# and security scanning.
#
# TOOLS: shellcheck, clang-format, cppcheck
#-----------------------------------------------------------------------------

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check shell scripts
        shell: bash
        run: |
          echo "=== SHELL SCRIPT LINTING ==="
          failed=0
          for script in briteRepo/bin/* briteRepo/helpers/* 2>/dev/null; do
            [[ ! -f "$script" ]] && continue
            if file "$script" | grep -q "shell script"; then
              echo "Checking: $(basename $script)"
              if shellcheck "$script" 2>&1 | grep -qE "error"; then
                failed=$((failed + 1))
              else
                echo "  ✓ OK"
              fi
            fi
          done
          [[ $failed -eq 0 ]] && echo "✓ Scripts valid" || exit 1
